# inmc-monster 메시지
# MiniMessage 태그와 &a 형태의 색상 코드를 함께 쓸 수 있습니다.
# 치환자: {몬스터} {플레이어네임} {레벨} {체력} {최대체력} {페이즈} {좌표} {개수} {시간} {아이템}

prefix: "<gradient:#c62828:#ff8a65>[ 몬스터 ]</gradient> "

no-permission: "<red>권한이 없습니다.</red>"
player-only: "<red>이 명령어는 플레이어만 사용할 수 있습니다.</red>"
not-ready: "<gray>플러그인이 아직 준비 중입니다. 잠시 후 다시 시도해주세요.</gray>"
usage: "<gray>/몹 <white>[gui|소환|목록|생성|삭제|복제|정리|상태|리로드]</white></gray>"

reloading: "<gray>설정을 다시 읽는 중...</gray>"
reloaded: "<green>설정을 다시 읽었습니다. <gray>(몬스터 {개수}종)</gray></green>"
