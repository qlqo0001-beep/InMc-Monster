mob-unknown: "<red>'{몬스터}' 이라는 몬스터를 찾을 수 없습니다.</red>"
mob-created: "<green>'{몬스터}' 몬스터를 만들었습니다.</green>"
mob-exists: "<red>'{몬스터}' 몬스터가 이미 존재합니다.</red>"
mob-invalid-name: "<red>몬스터 이름은 한글/영문/숫자/_/- 만 사용할 수 있습니다. (32자 이내)</red>"
mob-deleted: "<yellow>'{몬스터}' 몬스터를 삭제했습니다.</yellow>"
mob-copied: "<green>'{몬스터}' 을(를) 복제했습니다.</green>"
