mob-disabled: "<red>'{몬스터}' 은(는) 비활성화 상태입니다.</red>"

spawn-success: "<green>'{몬스터}' 을(를) {좌표} 에 소환했습니다. <gray>({개수}마리)</gray></green>"
spawn-failed: "<red>몬스터를 소환하지 못했습니다. 엔티티 타입이나 위치를 확인해주세요.</red>"
spawn-budget-full: "<red>스폰 한도에 도달했습니다. <gray>(/몹 상태 로 확인)</gray></red>"
spawn-world-disabled: "<red>이 월드에서는 커스텀 몬스터가 비활성화되어 있습니다.</red>"

