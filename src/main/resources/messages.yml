drop-protected: "<gray>이 아이템은 아직 다른 플레이어가 주울 수 없습니다.</gray>"

respawn-warning: "<yellow>{몬스터}</yellow><gray>이(가) </gray><white>{시간}</white><gray> 후에 등장합니다.</gray>"

prompt-cancelled: "<gray>입력을 취소했습니다.</gray>"
prompt-timeout: "<gray>입력 시간이 초과되었습니다.</gray>"
prompt-invalid-number: "<red>숫자를 입력해주세요.</red>"
prompt-enter: "<yellow>채팅으로 값을 입력하세요. <gray>('취소' 입력 시 중단)</gray></yellow>"
