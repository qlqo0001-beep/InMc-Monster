# ─────────────────────────────────────────────────────────────────────────────
#  inmc-monster - 전역 설정
#
#  거의 모든 값은 /몹 GUI 에서 편집할 수 있습니다. 여기서 지정한 값은 기본값이며,
#  worlds/<월드>.yml 에서 월드별로 덮어쓸 수 있습니다.
# ─────────────────────────────────────────────────────────────────────────────

# 스폰 판정 과정을 콘솔에 출력합니다. 문제를 찾을 때만 켜세요.
debug: false

# ─── 스폰 한도 ────────────────────────────────────────────────────────────────
#
#  확률 스폰을 켜는 순간 반드시 필요한 안전장치입니다.
#  치환은 서버의 모든 자연스폰마다 판정되므로, 상한이 없으면 관대한 확률 하나와
#  바쁜 밤이 겹쳤을 때 엔티티 수가 손쓸 수 없이 불어납니다.
budget:
  # 서버 전체 최대 커스텀 몬스터 수
  global-max: 400
  # 월드별 최대 (worlds/<월드>.yml 의 max-mobs 가 있으면 그쪽이 우선)
  per-world-max: 200
  # 청크당 최대 - 한 자리에 쌓이는 것을 막습니다
  per-chunk-max: 6
  # 플레이어 주변 최대 - 플레이어가 체감하는 '너무 많다' 는 이 값입니다
  near-player-max: 24
  near-player-radius: 32
  # ModelEngine 모델 몬스터 전용 상한.
  # 모델 하나가 다수의 디스플레이 엔티티로 그려지므로 일반 몬스터와 같은 한도를
  # 쓰면 안 됩니다.
  modelled-max: 60

# ─── 자연 스폰 치환 ───────────────────────────────────────────────────────────
replacement:
  enabled: true
  # 모든 몬스터의 치환 확률에 곱해집니다. 0 으로 두면 치환이 전부 꺼집니다.
  chance-multiplier: 1.0

  # ⚠ 여기 적힌 스폰 사유만 치환됩니다. 기본값은 NATURAL 하나뿐이며,
  #   그럴 만한 이유가 있습니다:
  #     REINFORCEMENTS - 좀비가 좀비를 부르는 경로입니다. 치환하면 증식합니다.
  #     BREEDING       - 플레이어의 동물 농장이 몬스터 농장이 됩니다.
  #     SPAWNER_EGG    - 관리자가 스폰에그를 쓸 수 없게 됩니다.
  #     SPAWNER        - 몬스터 스포너 파밍장이 전부 오염됩니다.
  #   하나씩, 의도를 가지고 추가하세요.
  allowed-spawn-reasons:
    - NATURAL

# ─── 수식어 (접두/접미) ───────────────────────────────────────────────────────
affix:
  # 바닐라 몬스터에도 수식어를 붙일지. '가끔 강력한 좀비가 나오는' 연출입니다.
  vanilla-enabled: true
  # 바닐라 몬스터에 붙을 확률. 서버의 모든 자연스폰에 적용되므로 낮게 두세요.
  vanilla-chance: 3.0
  # 커스텀 몬스터에 붙을 기본 확률 (몬스터별로 덮어쓸 수 있습니다)
  custom-chance: 10.0
  max-prefix: 1
  max-suffix: 1
  # 재시작 시 수식어만 붙은 바닐라 몬스터를 '제거' 하지 않고 '수식어만 해제' 합니다.
  # 끄면 재시작할 때마다 평범한 좀비들이 사라지는 것처럼 보입니다.
  strip-vanilla-instead-of-remove: true

# ─── 드랍 ─────────────────────────────────────────────────────────────────────
drops:
  # 새 드랍을 등록할 때 들어가는 기본 확률
  default-chance: 25.0
  # 플레이어가 처치했을 때만 드랍. 끄면 용암에 몰아넣는 파밍이 가능해집니다.
  require-player-kill: true
  # 획득자만 주울 수 있는 보호 시간(초). 0 이면 보호하지 않습니다.
  killer-protect-seconds: 8
  # 드랍 공지 기능 자체의 on/off (항목별 설정은 각 드랍에서)
  announce: true

# ─── 표시 ─────────────────────────────────────────────────────────────────────
display:
  # 몬스터 위 이름표.
  nameplates: true
  # 이름표에 현재 체력을 함께 표시할지.
  # 기본은 꺼짐 - 이름이 길어지고, 체력은 보스바 쪽이 훨씬 읽기 좋습니다.
  show-health: false
  show-level: true

  # 수식어만 붙은 바닐라 몬스터(예: 강력한 좀비)의 이름표
  affix-nameplates: true
  # 그 이름표를 항상 띄울지.
  # 기본은 꺼짐 - 켜면 평범한 필드 몬스터의 라벨이 맵 저편에서까지 보여서
  # '가끔 섞여 있다' 는 느낌이 사라지고 그냥 어수선해집니다.
  #
  # 꺼두면 조준했을 때만 보입니다. 바닐라의 기본 조준 인식 거리는 매우 짧으니,
  # 더 멀리서 보이게 하려면 몬스터 스탯의 NAME_TAG_DISTANCE 를 올리세요.
  affix-always-show-name: false

  # 보스바 (몬스터별로 켜야 표시됩니다)
  boss-bars: true
  boss-bar-radius: 48
  # 커스텀 몬스터가 등장할 때 주변에 알림
  announce-spawn: false
  # 처치했을 때 서버에 알림
  announce-death: false

# ─── 정리 ─────────────────────────────────────────────────────────────────────
#
#  커스텀 몬스터는 재시작을 넘어 살아남지 않습니다. 필드 몬스터가 재부팅마다
#  쌓이는 것을 막기 위한 정책이며, 월드보스는 사망 이벤트의 '리스폰 예약' 으로
#  되살립니다.
cleanup:
  on-startup: true
  on-chunk-load: true
  on-shutdown: true

# ─── 등장 조건 ────────────────────────────────────────────────────────────────
triggers:
  enabled: true
  # 이 기간 동안 접속하지 않은 플레이어의 진행도는 삭제됩니다.
  # 없으면 진행도 파일이 계속 자라기만 합니다.
  counter-expiry-days: 14
  default-cooldown-seconds: 120
  # 0 이면 하루 제한 없음
  default-daily-limit: 0

# ─── 안전장치 ─────────────────────────────────────────────────────────────────
#
#  몬스터가 죽으면서 다른 몬스터를 소환하고, 그 몬스터가 다시 원래 몬스터를
#  소환하는 설정은 두 줄이면 만들 수 있습니다. 이 값이 그 연쇄를 끊습니다.
#  소환된 몬스터는 부모의 깊이 +1 을 물려받고, 이 값을 넘으면 거부됩니다.
max-spawn-generation: 3

# 스킬·패턴 처리 주기(틱). 2 면 부드럽고, 올리면 정밀도를 CPU 와 맞바꿉니다.
# 활성 커스텀 몬스터가 없으면 이 작업은 아예 돌지 않습니다.
skill-tick-period: 2
