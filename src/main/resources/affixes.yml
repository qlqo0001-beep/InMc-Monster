# 몬스터 수식어 (접두/접미)
#
# mult 는 곱연산, add 는 합연산이며 항상 mult 를 먼저 적용합니다.
# 순서가 정해져 있는 이유: add 를 먼저 적용하면 무관한 x1.2 수식어가 +5 수식어를
# 조용히 증폭시켜, 각각은 약해 보이는 두 수식어가 예상 밖의 조합이 됩니다.
#
# apply-to: CUSTOM (커스텀 몬스터), VANILLA (바닐라 자연스폰 몬스터)

강력한:
  display: "<red>강력한</red>"
  type: PREFIX
  weight: 25
  apply-to: [ CUSTOM, VANILLA ]
  modifiers:
    ATTACK_DAMAGE:
      mult: 1.35
      add: 2.0
    MAX_HEALTH:
      mult: 1.25
  drop-multiplier: 1.4
  exp-multiplier: 1.4

날쌘:
  display: "<aqua>날쌘</aqua>"
  type: PREFIX
  weight: 25
  apply-to: [ CUSTOM, VANILLA ]
  modifiers:
    MOVEMENT_SPEED:
      mult: 1.35
    DODGE_RATING:
      add: 15.0
  drop-multiplier: 1.2
  exp-multiplier: 1.2

단단한:
  display: "<gray>단단한</gray>"
  type: PREFIX
  weight: 25
  apply-to: [ CUSTOM, VANILLA ]
  modifiers:
    MAX_HEALTH:
      mult: 1.8
    ARMOR:
      add: 6.0
    KNOCKBACK_RESISTANCE:
      add: 0.4
  drop-multiplier: 1.3
  exp-multiplier: 1.3

거대한:
  display: "<gold>거대한</gold>"
  type: PREFIX
  weight: 10
  apply-to: [ CUSTOM, VANILLA ]
  modifiers:
    SCALE:
      mult: 1.4
    MAX_HEALTH:
      mult: 1.6
    ATTACK_KNOCKBACK:
      add: 1.0
  drop-multiplier: 1.5
  exp-multiplier: 1.5

욕심많은:
  display: "<yellow>욕심많은</yellow>"
  type: SUFFIX
  weight: 15
  apply-to: [ CUSTOM, VANILLA ]
  modifiers:
    DROP_MULTIPLIER:
      add: 100.0
  drop-multiplier: 1.0
  exp-multiplier: 1.0

잔혹한:
  display: "<dark_red>잔혹한</dark_red>"
  type: SUFFIX
  weight: 15
  apply-to: [ CUSTOM ]
  modifiers:
    CRITICAL_STRIKE_CHANCE:
      add: 25.0
    CRITICAL_STRIKE_POWER:
      add: 50.0
  drop-multiplier: 1.2
  exp-multiplier: 1.2
  glow-color: RED

굶주린:
  display: "<dark_purple>굶주린</dark_purple>"
  type: SUFFIX
  weight: 15
  apply-to: [ CUSTOM ]
  modifiers:
    LIFESTEAL:
      add: 30.0
    FOLLOW_RANGE:
      add: 16.0
  drop-multiplier: 1.2
  exp-multiplier: 1.2
